# Terraform Provider testing workflow.
name: Tests

# This GitHub action runs your tests for each pull request and push.
# Optionally, you can turn it on using a schedule for regular testing.
on:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    paths-ignore:
      - 'README.md'

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

jobs:
  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go build -v .
      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go generate ./...
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'go generate ./...' command and commit."; exit 1)

  # Run acceptance tests with different Terraform and Meilisearch versions
  test:
    name: Terraform ${{ matrix.terraform }} / Meilisearch ${{ matrix.meilisearch }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Run tests on Meilisearch versions 1.7, 1.15, 1.30, 1.50 with Terraform version 1.16
          - terraform: '1.16.*'
            meilisearch: 'v1.7'
          - terraform: '1.16.*'
            meilisearch: 'v1.15'
          - terraform: '1.16.*'
            meilisearch: 'v1.30'
          - terraform: '1.16.*'
            meilisearch: 'v1.50'

          # Run tests on Terraform versions 1.0, 1.4, 1.8, 1.12 with Meilisearch version 1.50
          - terraform: '1.0.*'
            meilisearch: 'v1.50'
          - terraform: '1.4.*'
            meilisearch: 'v1.50'
          - terraform: '1.8.*'
            meilisearch: 'v1.50'
          - terraform: '1.12.*'
            meilisearch: 'v1.50'
    services:
      meilisearch:
        image: "getmeili/meilisearch:${{ matrix.meilisearch }}"
        env:
          MEILI_MASTER_KEY: "T35T-M45T3R-K3Y"
        ports:
          - 7700:7700
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run init script
        run: docker_compose/test_init.sh
        shell: bash
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go mod download
      - env:
          TF_ACC: "1"
        run: go test -v -cover ./internal/provider/
        timeout-minutes: 10
